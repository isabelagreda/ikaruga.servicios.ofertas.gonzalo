<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>IKARUGA · En actualización</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #f7f3ed; color: #171412; font-family: Arial, Helvetica, sans-serif; }
    main { width: min(100%, 680px); padding: 56px 48px; text-align: center; background: #fffdf9; border: 1px solid #ded7cd; border-radius: 24px; box-shadow: 0 16px 48px rgba(50, 36, 22, .1); }
    .brand { margin: 0 0 34px; color: #8a123a; font: 700 1.1rem/1 Georgia, serif; letter-spacing: .14em; }
    .line { width: 48px; height: 3px; margin: 0 auto 28px; background: #8a123a; }
    h1 { margin: 0; font: 700 clamp(2rem, 6vw, 3.4rem)/1.1 Georgia, serif; }
    p { max-width: 450px; margin: 22px auto 0; color: #514b45; font-size: 1.1rem; line-height: 1.55; }
    @media (max-width: 520px) { main { padding: 44px 26px; border-radius: 18px; } }
  </style>
</head>
<body>
  <main>
    <p class="brand">IKARUGA</p>
    <div class="line"></div>
    <h1>Estamos realizando una actualización.</h1>
    <p>La página no está disponible momentáneamente. Volvemos pronto.</p>
  </main>
</body>
</html>
